<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Order | {{ shop_name }}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .form-card {
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.08);
        }

        .input-box {
            transition: all 0.2s ease;
        }

        .input-box:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .create-btn {
            transition: all 0.2s ease;
        }

        .create-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
        }
    </style>

</head>


<body class="bg-slate-50 min-h-screen">


<!-- ===================================================== -->
<!-- HEADER -->
<!-- ===================================================== -->

<header class="bg-white border-b border-gray-200">

    <div class="max-w-6xl mx-auto px-6 py-5">

        <div class="flex items-center justify-between">

            <!-- LEFT -->

            <div>

                <h1 class="text-2xl font-bold text-slate-900">
                    Add New Order
                </h1>

                <p class="text-sm text-slate-500 mt-1">
                    Create a new order for {{ shop_name }}
                </p>

            </div>


            <!-- BACK BUTTON -->

            <a href="{% url 'tailors:production' %}"
               class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-200 transition">

                ← Back to Production

            </a>

        </div>

    </div>

</header>



<!-- ===================================================== -->
<!-- MAIN -->
<!-- ===================================================== -->

<main class="flex justify-center px-4 py-8">


    <!-- ================================================= -->
    <!-- COMPACT CARD -->
    <!-- ================================================= -->

    <div class="form-card w-full max-w-2xl bg-white rounded-2xl border border-blue-100 overflow-hidden">


        <!-- ================================================= -->
        <!-- CARD HEADER -->
        <!-- ================================================= -->

        <div class="px-6 py-5 bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-blue-100">

            <div class="flex items-center gap-4">


                <!-- ICON -->

                <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-7 h-7 text-blue-600"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="1.8">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M9 12h6m-6 4h6M9 8h6m3 13H6a2 2 0 01-2-2V5a2 2 0 012-2h8l4 4v12a2 2 0 01-2 2z"/>

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M14 3v4h4"/>

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M17 15h4m-2-2v4"/>

                    </svg>

                </div>


                <!-- TITLE -->

                <div>

                    <h2 class="text-xl font-bold text-slate-900">
                        Order Information
                    </h2>

                    <p class="text-sm text-slate-500 mt-1">
                        Enter customer and order details below.
                    </p>

                </div>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- FORM -->
        <!-- ================================================= -->

        <form method="POST" class="px-6 py-6">

            {% csrf_token %}


            <!-- ERROR -->

            {% if error %}

            <div class="mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600">
                {{ error }}
            </div>

            {% endif %}



            <!-- ================================================= -->
            <!-- FORM GRID -->
            <!-- ================================================= -->

            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-5">


                <!-- ================================================= -->
                <!-- CUSTOMER NAME -->
                <!-- ================================================= -->

                <div>

                    <label class="flex items-center gap-2 text-sm font-bold text-slate-800 mb-2">

                        <!-- Purple icon -->

                        <span class="w-6 h-6 rounded-md bg-purple-100 flex items-center justify-center">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="w-4 h-4 text-purple-600"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M15 19a6 6 0 00-12 0"/>

                                <circle cx="9" cy="7" r="4"/>

                            </svg>

                        </span>

                        Customer Name

                    </label>


                    <input
                        type="text"
                        name="customer_name"
                        placeholder="Customer name"
                        required
                        class="input-box w-full h-11 px-4 bg-white border border-gray-300 rounded-lg text-sm text-slate-800 outline-none"
                    >

                </div>



                <!-- ================================================= -->
                <!-- PRODUCT NAME -->
                <!-- ================================================= -->

                <div>

                    <label class="flex items-center gap-2 text-sm font-bold text-slate-800 mb-2">

                        <!-- Green icon -->

                        <span class="w-6 h-6 rounded-md bg-green-100 flex items-center justify-center">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="w-4 h-4 text-green-600"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>

                            </svg>

                        </span>

                        Product Name

                    </label>


                    <input
                        type="text"
                        name="product_name"
                        placeholder="e.g. Panjabi, Shirt, Suit"
                        required
                        class="input-box w-full h-11 px-4 bg-white border border-gray-300 rounded-lg text-sm text-slate-800 outline-none"
                    >

                </div>



                <!-- ================================================= -->
                <!-- TOTAL PRICE -->
                <!-- ================================================= -->

                <div>

                    <label class="flex items-center gap-2 text-sm font-bold text-slate-800 mb-2">

                        <!-- Yellow icon -->

                        <span class="w-6 h-6 rounded-md bg-yellow-100 flex items-center justify-center">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="w-4 h-4 text-yellow-600"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <circle cx="12" cy="12" r="9"/>

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M12 7v10M15 9.5c0-1-1.2-1.5-3-1.5s-3 .5-3 1.5 1.2 1.5 3 1.5 3 .5 3 1.5-1.2 1.5-3 1.5-3-.5-3-1.5"/>

                            </svg>

                        </span>

                        Total Price

                    </label>


                    <div class="flex">

                        <span class="w-12 h-11 flex items-center justify-center bg-slate-100 border border-r-0 border-gray-300 rounded-l-lg text-lg text-slate-700">
                            ৳
                        </span>


                        <input
                            type="number"
                            name="total_price"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            required
                            class="input-box w-full h-11 px-4 bg-white border border-gray-300 rounded-r-lg text-sm text-slate-800 outline-none"
                        >

                    </div>

                </div>



                <!-- ================================================= -->
                <!-- TAILOR SHOP -->
                <!-- ================================================= -->

                <div>

                    <label class="flex items-center gap-2 text-sm font-bold text-slate-800 mb-2">

                        <!-- Pink icon -->

                        <span class="w-6 h-6 rounded-md bg-pink-100 flex items-center justify-center">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="w-4 h-4 text-pink-600"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6M8 10h.01M12 10h.01M16 10h.01"/>

                            </svg>

                        </span>

                        Tailor Shop

                    </label>


                    <input
                        type="text"
                        value="{{ shop_name }}"
                        readonly
                        class="w-full h-11 px-4 bg-slate-100 border border-slate-200 rounded-lg text-sm text-slate-500 outline-none"
                    >

                </div>


            </div>



            <!-- ================================================= -->
            <!-- PRODUCTION INFORMATION -->
            <!-- ================================================= -->

            <div class="mt-6 px-4 py-3.5 bg-blue-50 border border-blue-100 rounded-xl">

                <div class="flex items-center gap-3">


                    <!-- INFO ICON -->

                    <div class="w-9 h-9 flex-shrink-0 rounded-full bg-blue-500 flex items-center justify-center">

                        <span class="text-white font-bold text-lg">
                            i
                        </span>

                    </div>


                    <!-- TEXT -->

                    <p class="text-sm text-blue-700 leading-5">

                        <strong class="text-blue-800">
                            Production:
                        </strong>

                        New orders appear in

                        <strong class="text-blue-800">
                            New Requests
                        </strong>

                        and move to

                        <strong class="text-blue-800">
                            Cutting
                        </strong>

                        after acceptance.

                    </p>


                </div>

            </div>



            <!-- ================================================= -->
            <!-- BUTTON AREA -->
            <!-- ================================================= -->

            <div class="flex justify-end items-center gap-3 mt-6 pt-5 border-t border-gray-100">


                <!-- CANCEL -->

                <a href="{% url 'tailors:production' %}"
                   class="px-5 py-2.5 bg-slate-100 text-slate-700 rounded-lg text-sm font-semibold hover:bg-slate-200 transition">

                    Cancel

                </a>



                <!-- CREATE -->

                <button
                    type="submit"
                    class="create-btn px-6 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700">

                    + Create Order

                </button>


            </div>


        </form>

    </div>

</main>


</body>
</html>
